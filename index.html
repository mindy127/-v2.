<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>

.hf{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.hf select,.hf textarea{width:100%}
.two{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start}.two>*{flex:1 1 280px;min-width:0}#pipw{position:relative;border:2px solid var(--l);border-radius:6px;overflow:hidden}#cv2{width:100%;aspect-ratio:16/9;display:block;background:#050912}#pipl{position:absolute;left:6px;top:6px;font-size:12px;background:#0c1730dd;padding:1px 6px;border-radius:5px}

</style></head><body>
<div id="flash"></div>
<header><h1>引擎組裝站 主管監控</h1><span class="tag">模擬資料 · v1.0</span><div id="chip">待機</div></header>

<div class="two"><details class="card"><summary>顯示與聲音設定</summary><div class="row">

<div class="row"><button id="dL">模擬左槍斷線</button><button id="dR">模擬右槍斷線</button></div></details><div class="card"><h3>異常特寫（攝影機視角）</h3><div id="pipw"><canvas id="cv2"></canvas><div id="pipl">LEFT UP · 待命</div></div><div class="row" id="pb"><button data-p="-1" class="on">自動</button><button data-p="0">LEFT UP</button><button data-p="1">RIGHT UP</button><button data-p="2">RIGHT</button></div><small style="color:var(--m)">自動：異常時切到發生側的攝影機並拉近；也可手動固定某支攝影機。</small></div></div>
</div>
<div id="print">

</div></main>
